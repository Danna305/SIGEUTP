<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Iniciar sesión · Módulo 3 · SIGEP UTP</title>
<meta name="description" content="Acceso a la PWA de pre-auditoría de tesinas y seguimiento académico del SIGEP UTP.">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="../img/icon-192.png">
<meta name="theme-color" content="#0056b3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SIGEP UTP">
<link rel="apple-touch-icon" sizes="180x180" href="../img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../css/sigep.css">
</head>
<body data-modulo="3">
<main class="login-page">
  <section class="login-card" aria-labelledby="login-title">
    <header class="login-head">
      <img class="login-logo" src="../img/icono-sigep.svg" width="58" height="58" alt="Logo SIGEP UTP">
      <div>
        <h1 id="login-title">SIGEP UTP</h1>
        <p>Sistema de Gestión de Estadías</p>
      </div>
    </header>

    <form class="login-form" id="login-form" autocomplete="on">
      <label class="login-field">
        <span>Correo institucional</span>
        <span class="login-input">
          <i data-ic="mail"></i>
          <input type="email" id="login-correo" name="correo" required>
        </span>
      </label>

      <label class="login-field">
        <span>Contraseña</span>
        <span class="login-input">
          <i data-ic="lock"></i>
          <input type="password" id="login-password" name="password" autocomplete="current-password" required>
          <button class="pwd-toggle" type="button" id="toggle-password" aria-label="Mostrar contraseña" aria-controls="login-password" aria-pressed="false">
            <i data-ic="eye"></i>
          </button>
        </span>
      </label>

      <div class="login-forgot">
        <a href="#" id="recuperar-link">¿Olvidaste tu contraseña?</a>
      </div>

      <button class="btn block login-submit" type="submit">
        Iniciar Sesión
      </button>

      <p class="login-status" id="login-status" role="status" aria-live="polite"></p>
    </form>
  </section>
</main>

<dialog class="login-dialog" id="recuperar-dialog" aria-labelledby="recuperar-title">
  <form id="recuperar-form">
    <div class="dialog-head">
      <h2 id="recuperar-title">Recuperar contraseña</h2>
      <button class="icon-btn" type="button" id="recuperar-cerrar" aria-label="Cerrar">
        <i data-ic="x"></i>
      </button>
    </div>
    <p class="sub">Escribe tu correo institucional y te enviaremos las instrucciones para restablecer tu contraseña.</p>
    <label class="login-field">
      <span>Correo institucional</span>
      <span class="login-input">
        <i data-ic="mail"></i>
        <input type="email" id="recuperar-correo" name="correo-recuperacion" placeholder="usuario@utp.edu.mx" autocomplete="email" required>
      </span>
    </label>
    <button class="btn block" type="submit" id="recuperar-enviar">
      <i data-ic="send"></i>Enviar instrucciones
    </button>
    <p class="login-status" id="recuperar-status" role="status" aria-live="polite"></p>
  </form>
</dialog>

<script src="../../js/vendor/supabase.js"></script>
<script src="../../js/config.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/sigep.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const form = document.getElementById('login-form');
    const status = document.getElementById('login-status');
    const correo = document.getElementById('login-correo');
    const password = document.getElementById('login-password');
    const toggle = document.getElementById('toggle-password');
    const recuperarLink = document.getElementById('recuperar-link');
    const dialog = document.getElementById('recuperar-dialog');
    const recuperarForm = document.getElementById('recuperar-form');
    const recuperarCorreo = document.getElementById('recuperar-correo');
    const recuperarStatus = document.getElementById('recuperar-status');
    const recuperarEnviar = document.getElementById('recuperar-enviar');
    const recuperarCerrar = document.getElementById('recuperar-cerrar');
    const auth = window.SIGEPAuth;
    const boton = form.querySelector('.login-submit');

    const destino = (rol) => rol === 'alumno' ? 'alumno.html' : 'modulo-3.html';
    const aviso = (texto, color) => {
      if (!status) return;
      status.style.color = color || 'var(--c-brand-500, #0056b3)';
      status.textContent = texto;
    };

    if (new URLSearchParams(location.search).get('motivo') === 'sin-rol') {
      aviso('Esta cuenta no es de alumno ni de asesor.', '#dc3545');
    } else if (auth && auth.cliente) {
      // Si ya hay sesión (de este o de otro módulo de SIGEP), entra directo
      auth.cliente.auth.getSession().then(async ({ data }) => {
        if (!data.session) return;
        const perfil = await auth.verificar().catch(() => null);
        if (perfil) location.replace(destino(perfil.rol));
      });
    }

    // Toggle de visibilidad para contraseña
    toggle.addEventListener('click', () => {
      const mostrar = password.type === 'password';
      password.type = mostrar ? 'text' : 'password';
      toggle.setAttribute('aria-pressed', String(mostrar));
      toggle.setAttribute('aria-label', mostrar ? 'Ocultar contraseña' : 'Mostrar contraseña');
      if (window.ic) toggle.innerHTML = window.ic(mostrar ? 'eyeOff' : 'eye');
      password.focus();
    });

    // Inicio de sesión con Supabase Auth (las mismas cuentas de los módulos 1 y 4)
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const mailVal = correo.value.trim().toLowerCase();
      const pwdVal = password.value;
      if (!mailVal || !pwdVal) return;

      if (!navigator.onLine) {
        aviso('Necesitas conexión para iniciar sesión. Si ya habías entrado, la app abre sola con tu sesión guardada.', '#dc3545');
        return;
      }
      if (!auth || !auth.cliente) {
        aviso('Falta la configuración de Supabase (js/config.js).', '#dc3545');
        return;
      }

      boton.disabled = true;
      aviso('Validando credenciales...');
      try {
        const { error } = await auth.cliente.auth.signInWithPassword({ email: mailVal, password: pwdVal });
        if (error) {
          aviso(/invalid login credentials/i.test(error.message) ? 'Correo o contraseña incorrectos.' : 'No se pudo iniciar sesión. Inténtalo de nuevo.', '#dc3545');
          return;
        }
        const perfil = await auth.verificar();
        if (!perfil) return; // verificar() ya redirigió
        aviso(`¡Bienvenido ${perfil.nombre}! Redirigiendo...`, '#28a745');
        setTimeout(() => location.replace(destino(perfil.rol)), 500);
      } catch (err) {
        console.error('Falló el login:', err);
        aviso('Error al conectar con la base de datos. Inténtalo de nuevo.', '#dc3545');
      } finally {
        boton.disabled = false;
      }
    });

    // Manejo de Modal de Recuperación
    const abrirRecuperacion = () => {
      if (!dialog) return;
      if (recuperarCorreo) recuperarCorreo.value = correo.value.trim();
      if (recuperarStatus) recuperarStatus.textContent = '';
      if (recuperarEnviar) recuperarEnviar.disabled = false;
      if (typeof dialog.showModal === 'function') dialog.showModal();
      else dialog.setAttribute('open', '');
      if (recuperarCorreo) setTimeout(() => recuperarCorreo.focus(), 60);
    };

    if (recuperarLink) {
      recuperarLink.addEventListener('click', (event) => {
        event.preventDefault();
        abrirRecuperacion();
      });
    }

    if (recuperarCerrar) recuperarCerrar.addEventListener('click', () => dialog.close());

    if (dialog) {
      dialog.addEventListener('click', (event) => {
        if (event.target === dialog) dialog.close();
      });
    }

    if (recuperarForm) {
      recuperarForm.addEventListener('submit', (event) => {
        event.preventDefault();
        if (!recuperarForm.checkValidity()) {
          recuperarForm.reportValidity();
          return;
        }
        recuperarEnviar.disabled = true;
        recuperarStatus.textContent = 'Enviando instrucciones…';
        const termina = () => {
          recuperarStatus.textContent = 'Si el correo está registrado, recibirás las instrucciones.';
          setTimeout(() => { if (dialog.open) dialog.close(); }, 1600);
        };
        if (!auth || !auth.cliente || !navigator.onLine) { termina(); return; }
        auth.cliente.auth.resetPasswordForEmail(recuperarCorreo.value.trim().toLowerCase(), {
          redirectTo: new URL('login.html', location.href).href
        }).finally(termina);
      });
    }
  });
</script>
</body>
</html>
