<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Iniciar sesión · SIGEP UTP</title>
<meta name="description" content="Acceso a la PWA de pre-auditoría de tesinas y seguimiento académico del SIGEP UTP.">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="../img/icon-192.png">
<meta name="theme-color" content="#0056b3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SIGEP UTP">
<link rel="apple-touch-icon" sizes="180x180" href="../img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../css/sigep.css">
</head>
<body data-modulo="3">
<main class="login-page">
  <section class="login-card" aria-labelledby="login-title">
    <header class="login-head">
      <img class="login-logo" src="../img/icono-sigep.svg" width="58" height="58" alt="Logo SIGEP UTP">
      <div>
        <h1 id="login-title">SIGEP UTP</h1>
        <p>Sistema de Gestión de Estadías</p>
      </div>
    </header>

    <form class="login-form" id="login-form" autocomplete="on">
      <label class="login-field">
        <span>Correo institucional</span>
        <span class="login-input">
          <i data-ic="mail"></i>
          <input type="email" id="login-correo" name="correo" required>
        </span>
      </label>

      <label class="login-field">
        <span>Contraseña</span>
        <span class="login-input">
          <i data-ic="lock"></i>
          <input type="password" id="login-password" name="password" autocomplete="current-password" required>
          <button class="pwd-toggle" type="button" id="toggle-password" aria-label="Mostrar contraseña" aria-controls="login-password" aria-pressed="false">
            <i data-ic="eye"></i>
          </button>
        </span>
      </label>

      <div class="login-forgot">
        <a href="#" id="recuperar-link">¿Olvidaste tu contraseña?</a>
      </div>

      <button class="btn block login-submit" type="submit">
        Iniciar Sesión
      </button>

      <p class="login-status" id="login-status" role="status" aria-live="polite"></p>
    </form>
  </section>
</main>

<dialog class="login-dialog" id="recuperar-dialog" aria-labelledby="recuperar-title">
  <form id="recuperar-form">
    <div class="dialog-head">
      <h2 id="recuperar-title">Recuperar contraseña</h2>
      <button class="icon-btn" type="button" id="recuperar-cerrar" aria-label="Cerrar">
        <i data-ic="x"></i>
      </button>
    </div>
    <p class="sub">Escribe tu correo institucional y te enviaremos las instrucciones para restablecer tu contraseña.</p>
    <label class="login-field">
      <span>Correo institucional</span>
      <span class="login-input">
        <i data-ic="mail"></i>
        <input type="email" id="recuperar-correo" name="correo-recuperacion" placeholder="usuario@utp.edu.mx" autocomplete="email" required>
      </span>
    </label>
    <button class="btn block" type="submit" id="recuperar-enviar">
      <i data-ic="send"></i>Enviar instrucciones
    </button>
    <p class="login-status" id="recuperar-status" role="status" aria-live="polite"></p>
  </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/sigep.js"></script>
<script src="../js/sync.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const form = document.getElementById('login-form');
    const status = document.getElementById('login-status');
    const correo = document.getElementById('login-correo');
    const password = document.getElementById('login-password');
    const toggle = document.getElementById('toggle-password');
    const recuperarLink = document.getElementById('recuperar-link');
    const dialog = document.getElementById('recuperar-dialog');
    const recuperarForm = document.getElementById('recuperar-form');
    const recuperarCorreo = document.getElementById('recuperar-correo');
    const recuperarStatus = document.getElementById('recuperar-status');
    const recuperarEnviar = document.getElementById('recuperar-enviar');
    const recuperarCerrar = document.getElementById('recuperar-cerrar');

    const destino = (rol) => rol === 'alumno' ? 'modulo-4.html' : 'modulo-3.html';

    // Persiste la sesión en localStorage (claves individuales + objeto sigep_sesion)
    // para que la PWA recuerde el rol y no vuelva a pedir credenciales al reabrir.
    const guardarSesion = (usuario) => {
      const sesion = {
        id: usuario.id || usuario.userId || '',
        userId: usuario.id || usuario.userId || '',
        nombre: usuario.nombre || '',
        correo: usuario.correo || '',
        rol: usuario.rol || '',
        fecha: Date.now()
      };
      try {
        localStorage.setItem('sigep-user-id', sesion.userId);
        localStorage.setItem('sigep-nombre', sesion.nombre);
        localStorage.setItem('sigep-correo', sesion.correo);
        localStorage.setItem('sigep-rol', sesion.rol);
        localStorage.setItem('sigep-login', String(sesion.fecha));
        localStorage.setItem('sigep_sesion', JSON.stringify(sesion));
      } catch (error) {
        console.warn('[SIGEP] No se pudo persistir la sesión:', error);
      }
      return sesion;
    };

    // Toggle de visibilidad para contraseña
    toggle.addEventListener('click', () => {
      const mostrar = password.type === 'password';
      password.type = mostrar ? 'text' : 'password';
      toggle.setAttribute('aria-pressed', String(mostrar));
      toggle.setAttribute('aria-label', mostrar ? 'Ocultar contraseña' : 'Mostrar contraseña');
      if (window.ic) toggle.innerHTML = window.ic(mostrar ? 'eyeOff' : 'eye');
      password.focus();
    });

    // Iniciar Sesión conectando a Supabase
form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const mailVal = correo.value.trim();
      const pwdVal = password.value;

      if (!mailVal || !pwdVal) return;

      if (status) {
        status.style.color = 'var(--c-brand-500, #0056b3)';
        status.textContent = 'Validando credenciales...';
      }

      // 1. Manejo Offline
      if (!navigator.onLine) {
        const lastMail = localStorage.getItem('sigep-correo');
        const lastRol = localStorage.getItem('sigep-rol');
        if (lastMail && lastMail === mailVal && lastRol) {
          guardarSesion({
            id: localStorage.getItem('sigep-user-id') || '',
            nombre: localStorage.getItem('sigep-nombre') || '',
            correo: lastMail,
            rol: lastRol
          });
          if (status) status.textContent = 'Modo offline: accediendo con sesión guardada...';
          setTimeout(() => { window.location.href = destino(lastRol); }, 800);
          return;
        } else {
          if (status) {
            status.style.color = '#dc3545';
            status.textContent = 'Sin conexión. Solo puedes ingresar con una cuenta iniciada previamente.';
          }
          return;
        }
      }

      try {
        // 2. Garantizar obtención del cliente Supabase
        let client = window.supabaseClient;
        if (!client && window.SIGEPSync && typeof window.SIGEPSync.crearCliente === 'function') {
          client = await window.SIGEPSync.crearCliente();
        }

        if (!client) {
          throw new Error('No se pudo establecer conexión con el cliente de Supabase.');
        }

        const emailNormalizado = mailVal.toLowerCase();
        const funcionFaltante = (error) => {
          const texto = `${error && error.code ? error.code : ''} ${error && error.message ? error.message : ''} ${error && error.details ? error.details : ''}`.toLowerCase();
          return /pgrst202|verificar_login|does not exist|schema cache/.test(texto);
        };

        // 3a. Validación segura de credenciales mediante RPC (bcrypt en PostgreSQL)
        let user = null;
        const { data: verificacion, error: errorRpc } = await client.rpc('verificar_login', {
          p_correo: emailNormalizado,
          p_password: pwdVal
        });

        if (errorRpc) {
          if (!funcionFaltante(errorRpc)) {
            console.error('Error detallado de Supabase:', errorRpc);
            throw errorRpc;
          }
          // 3b. Compatibilidad: validación por correo si el RPC aún no está desplegado
          console.warn('[SIGEP Auth] La función verificar_login no existe. Aplica BD/supabase.sql para validar contraseñas.');
          const { data: legado, error: errorLegado } = await client
            .from('usuarios')
            .select('id, nombre, correo, rol')
            .eq('correo', emailNormalizado)
            .maybeSingle();
          if (errorLegado) {
            console.error('Error detallado de Supabase:', errorLegado);
            throw errorLegado;
          }
          user = legado;
        } else {
          user = Array.isArray(verificacion) ? verificacion[0] : verificacion;
        }

        if (!user) {
          if (status) {
            status.style.color = '#dc3545';
            status.textContent = 'Correo o contraseña incorrectos.';
          }
          return;
        }

        // 4. Éxito: Guardar sesión y redirigir
        guardarSesion(user);

        if (status) {
          status.style.color = '#28a745';
          status.textContent = `¡Bienvenido ${user.nombre}! Redirigiendo...`;
        }

        setTimeout(() => {
          window.location.href = destino(user.rol);
        }, 600);

      } catch (err) {
        console.error('Falló el login:', err);
        if (status) {
          status.style.color = '#dc3545';
          status.textContent = 'Error al conectar con la base de datos. Abre la consola (F12) para más detalles.';
        }
      }
    });

    // Manejo de Modal de Recuperación
    const abrirRecuperacion = () => {
      if (!dialog) return;
      if (recuperarCorreo) recuperarCorreo.value = correo.value.trim();
      if (recuperarStatus) recuperarStatus.textContent = '';
      if (recuperarEnviar) recuperarEnviar.disabled = false;
      if (typeof dialog.showModal === 'function') dialog.showModal();
      else dialog.setAttribute('open', '');
      if (recuperarCorreo) setTimeout(() => recuperarCorreo.focus(), 60);
    };

    if (recuperarLink) {
      recuperarLink.addEventListener('click', (event) => {
        event.preventDefault();
        abrirRecuperacion();
      });
    }

    if (recuperarCerrar) recuperarCerrar.addEventListener('click', () => dialog.close());

    if (dialog) {
      dialog.addEventListener('click', (event) => {
        if (event.target === dialog) dialog.close();
      });
    }

    if (recuperarForm) {
      recuperarForm.addEventListener('submit', (event) => {
        event.preventDefault();
        if (!recuperarForm.checkValidity()) {
          recuperarForm.reportValidity();
          return;
        }
        recuperarEnviar.disabled = true;
        recuperarStatus.textContent = 'Enviando instrucciones…';
        setTimeout(() => {
          recuperarStatus.textContent = 'Si el correo está registrado, recibirás las instrucciones.';
          setTimeout(() => { if (dialog.open) dialog.close(); }, 1600);
        }, 700);
      });
    }
  });
</script>
</body>
</html>
